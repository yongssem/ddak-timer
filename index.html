<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>우리반 타이머 · 무궁무진클래스</title>
  <meta name="description" content="초등 교실 전자칠판용 풀스크린 픽셀 타이머. 16비트 레트로 스타일." />
  <meta property="og:title" content="우리반 타이머" />
  <meta property="og:description" content="전자칠판용 16비트 픽셀 타이머" />
  <meta property="og:type" content="website" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%23FF9500'/%3E%3Crect x='3' y='3' width='10' height='10' fill='%232B2B2B'/%3E%3Crect x='5' y='5' width='6' height='6' fill='%23FFF8F0'/%3E%3Crect x='7' y='5' width='2' height='4' fill='%232B2B2B'/%3E%3Crect x='7' y='7' width='4' height='2' fill='%232B2B2B'/%3E%3C/svg%3E" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      corePlugins: { preflight: true },
      theme: {
        extend: {
          colors: {
            timer: {
              main: '#FF9500',
              sub: '#4A90E2',
              cream: '#FFF8F0',
              danger: '#FF3B30',
              ink: '#2B2B2B',
              gold: '#FFD700',
              green: '#00C853',
            }
          }
        }
      }
    };
  </script>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    @font-face {
      font-family: 'NeoDunggeunmo';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2201-2@1.0/NeoDunggeunmo.woff') format('woff');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    * {
      -webkit-font-smoothing: none;
      -moz-osx-font-smoothing: unset;
      font-smooth: never;
      image-rendering: pixelated;
    }

    html, body { height: 100%; }
    body {
      font-family: 'NeoDunggeunmo', 'DungGeunMo', monospace;
      background-color: #FFF8F0;
      background-image:
        linear-gradient(#2B2B2B 1px, transparent 1px),
        linear-gradient(90deg, #2B2B2B 1px, transparent 1px);
      background-size: 24px 24px;
      background-position: -1px -1px;
      background-blend-mode: normal;
      color: #2B2B2B;
      overflow: hidden;
      letter-spacing: 0;
      image-rendering: pixelated;
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background: rgba(255, 248, 240, 0.85);
      pointer-events: none;
      z-index: 0;
    }

    /* === 픽셀 타이머 숫자 === */
    .timer-digits {
      font-family: 'NeoDunggeunmo', monospace;
      font-size: clamp(7rem, 22vw, 26rem);
      line-height: 1;
      letter-spacing: 0.04em;
      color: #2B2B2B;
      text-shadow:
        4px 0 0 #FF9500,
        8px 4px 0 #2B2B2B;
    }
    .timer-colon {
      display: inline-block;
      margin: 0 0.05em;
    }
    .timer-colon.blink { animation: colonBlink 1s steps(2, start) infinite; }
    @keyframes colonBlink { 50% { opacity: 0; } }

    .finished .timer-digits {
      color: #FF3B30;
      text-shadow:
        4px 0 0 #FFD700,
        8px 4px 0 #2B2B2B;
    }

    /* === 화면 깜빡임 === */
    .flash { animation: flashBg 0.5s steps(2, end) 5; }
    @keyframes flashBg {
      0%, 49%   { background-color: #FF3B30; }
      50%, 100% { background-color: #FFF8F0; }
    }

    /* === 픽셀 버튼 공통 === */
    .pix-btn {
      font-family: 'NeoDunggeunmo', monospace;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #FFFFFF;
      color: #2B2B2B;
      border: 4px solid #2B2B2B;
      box-shadow: 4px 4px 0 #2B2B2B;
      padding: 0.6rem 1.1rem;
      font-size: 1.25rem;
      cursor: pointer;
      user-select: none;
      transition: none;
      position: relative;
    }
    .pix-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 #2B2B2B;
    }
    .pix-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 #2B2B2B;
    }

    .pix-btn.preset.active {
      background: #FF9500;
      color: #FFFFFF;
    }
    .pix-btn.primary {
      background: #FF9500;
      color: #FFFFFF;
      font-size: 1.75rem;
      padding: 0.9rem 2rem;
    }
    .pix-btn.secondary {
      background: #4A90E2;
      color: #FFFFFF;
      font-size: 1.75rem;
      padding: 0.9rem 2rem;
    }
    .pix-btn.danger {
      background: #FF3B30;
      color: #FFFFFF;
    }
    .pix-btn.fs {
      width: 56px; height: 56px;
      padding: 0;
      font-size: 0;
    }
    .pix-btn.fs::before {
      content: '';
      display: block;
      width: 24px; height: 24px;
      background:
        linear-gradient(#2B2B2B,#2B2B2B) left top/8px 4px no-repeat,
        linear-gradient(#2B2B2B,#2B2B2B) left top/4px 8px no-repeat,
        linear-gradient(#2B2B2B,#2B2B2B) right top/8px 4px no-repeat,
        linear-gradient(#2B2B2B,#2B2B2B) right top/4px 8px no-repeat,
        linear-gradient(#2B2B2B,#2B2B2B) left bottom/8px 4px no-repeat,
        linear-gradient(#2B2B2B,#2B2B2B) left bottom/4px 8px no-repeat,
        linear-gradient(#2B2B2B,#2B2B2B) right bottom/8px 4px no-repeat,
        linear-gradient(#2B2B2B,#2B2B2B) right bottom/4px 8px no-repeat;
    }

    @media (max-width: 640px) {
      .pix-btn { font-size: 1rem; padding: 0.5rem 0.8rem; border-width: 3px; box-shadow: 3px 3px 0 #2B2B2B; }
      .pix-btn.primary, .pix-btn.secondary { font-size: 1.25rem; padding: 0.7rem 1.4rem; }
      .pix-btn:hover { box-shadow: 5px 5px 0 #2B2B2B; }
      .pix-btn:active { box-shadow: 1px 1px 0 #2B2B2B; }
    }

    /* === 제목 입력 === */
    .title-input {
      font-family: 'NeoDunggeunmo', monospace;
      font-size: clamp(1.4rem, 3.5vw, 2.6rem);
      text-align: center;
      width: 100%;
      max-width: 92vw;
      background: transparent;
      border: 4px dashed transparent;
      outline: none;
      color: #2B2B2B;
      padding: 0.4rem 0.8rem;
    }
    .title-input::placeholder { color: rgba(43,43,43,0.35); }
    .title-input:focus {
      background: #FFFFFF;
      border-color: #2B2B2B;
      box-shadow: 4px 4px 0 #2B2B2B;
    }

    /* === 커스텀 시간 패널 === */
    .custom-panel {
      display: none;
      align-items: center;
      gap: 0.6rem;
      background: #FFFFFF;
      border: 4px solid #2B2B2B;
      box-shadow: 4px 4px 0 #2B2B2B;
      padding: 0.8rem 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .custom-panel.open { display: flex; }
    .custom-panel input {
      font-family: 'NeoDunggeunmo', monospace;
      width: 5rem;
      font-size: 1.5rem;
      text-align: center;
      background: #FFF8F0;
      border: 4px solid #2B2B2B;
      padding: 0.3rem 0.4rem;
      outline: none;
      color: #2B2B2B;
    }
    .custom-panel input:focus {
      background: #FFD700;
    }
    .custom-panel label {
      font-size: 1.25rem;
      color: #2B2B2B;
    }

    /* === 푸터 링크 === */
    .pix-link {
      color: #4A90E2;
      text-decoration: underline;
    }
    .pix-link:hover { color: #FF9500; }

    @media (max-width: 640px) {
      .timer-digits { font-size: clamp(5rem, 28vw, 10rem); text-shadow: 3px 0 0 #FF9500, 6px 3px 0 #2B2B2B; }
    }

    #app { position: relative; z-index: 1; }
  </style>
</head>
<body class="select-none">
  <div id="app" class="flex flex-col h-screen w-screen px-3 sm:px-6 py-3 sm:py-4">

    <header class="flex items-start justify-between gap-3 flex-wrap">
      <div class="flex items-center gap-2 sm:gap-3 flex-wrap">
        <button class="pix-btn preset" data-preset="1">1분</button>
        <button class="pix-btn preset" data-preset="3">3분</button>
        <button class="pix-btn preset" data-preset="5">5분</button>
        <button class="pix-btn preset" data-preset="10">10분</button>
        <button class="pix-btn preset" data-preset="15">15분</button>
        <button id="btnCustom" class="pix-btn">+TIME</button>
      </div>

      <button id="btnFullscreen" class="pix-btn fs" aria-label="풀스크린"></button>
    </header>

    <div id="customPanel" class="custom-panel mt-3 mx-auto">
      <label for="inpMin">MIN</label>
      <input id="inpMin" type="number" min="0" max="180" inputmode="numeric" value="0" />
      <label for="inpSec">SEC</label>
      <input id="inpSec" type="number" min="0" max="59" inputmode="numeric" value="30" />
      <button id="btnApplyCustom" class="pix-btn primary" style="font-size:1.1rem;padding:0.5rem 1rem;">SET</button>
      <button id="btnCloseCustom" class="pix-btn" style="font-size:1.1rem;padding:0.5rem 1rem;">X</button>
    </div>

    <main class="flex-1 flex flex-col items-center justify-center gap-3 sm:gap-6">
      <input id="titleInput" class="title-input" type="text" maxlength="40" placeholder="▶ 제목을 입력하세요" />
      <div id="timerDisplay" class="timer-digits">
        <span id="mm">00</span><span id="colon" class="timer-colon">:</span><span id="ss">00</span>
      </div>
    </main>

    <section class="flex items-center justify-center gap-3 sm:gap-5 pb-2">
      <button id="btnStart" class="pix-btn primary">START</button>
      <button id="btnReset" class="pix-btn secondary">RESET</button>
    </section>

    <footer class="text-center text-xs sm:text-base text-timer-ink pt-2 pb-1">
      © 2026 무궁무진클래스 · 용쌤 · <a href="https://mumuclass.kr" target="_blank" rel="noopener" class="pix-link">mumuclass.kr</a>
      <span class="hidden sm:inline ml-3">[SPACE] START/STOP · [R] RESET · [F] FULL</span>
    </footer>
  </div>

  <script>
    (() => {
      const STATES = { IDLE: 'idle', RUNNING: 'running', PAUSED: 'paused', FINISHED: 'finished' };

      const $mm = document.getElementById('mm');
      const $ss = document.getElementById('ss');
      const $colon = document.getElementById('colon');
      const $btnStart = document.getElementById('btnStart');
      const $btnReset = document.getElementById('btnReset');
      const $btnFullscreen = document.getElementById('btnFullscreen');
      const $presets = document.querySelectorAll('.pix-btn.preset[data-preset]');
      const $btnCustom = document.getElementById('btnCustom');
      const $customPanel = document.getElementById('customPanel');
      const $inpMin = document.getElementById('inpMin');
      const $inpSec = document.getElementById('inpSec');
      const $btnApplyCustom = document.getElementById('btnApplyCustom');
      const $btnCloseCustom = document.getElementById('btnCloseCustom');
      const $titleInput = document.getElementById('titleInput');

      let state = STATES.IDLE;
      let totalMs = 0;
      let remainingMs = 0;
      let targetEpoch = 0;
      let rafId = null;
      let intervalId = null;
      let finishTimeoutId = null;
      let audioCtx = null;

      function render() {
        const ms = Math.max(0, state === STATES.RUNNING ? targetEpoch - Date.now() : remainingMs);
        const totalSec = Math.ceil(ms / 1000);
        const mm = String(Math.floor(totalSec / 60)).padStart(2, '0');
        const ss = String(totalSec % 60).padStart(2, '0');
        if ($mm.textContent !== mm) $mm.textContent = mm;
        if ($ss.textContent !== ss) $ss.textContent = ss;

        $btnStart.textContent = state === STATES.RUNNING ? 'STOP' : (state === STATES.PAUSED ? 'GO!' : 'START');

        document.body.classList.toggle('finished', state === STATES.FINISHED);
        $colon.classList.toggle('blink', state === STATES.RUNNING);
      }

      function tick() {
        if (state !== STATES.RUNNING) return;
        if (Date.now() >= targetEpoch) {
          triggerFinish();
          return;
        }
        render();
        rafId = requestAnimationFrame(tick);
      }

      function triggerFinish() {
        if (state === STATES.FINISHED) return;
        stopLoops();
        remainingMs = 0;
        state = STATES.FINISHED;
        render();
        finishEffects();
      }

      function stopLoops() {
        if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
        if (intervalId) { clearInterval(intervalId); intervalId = null; }
        if (finishTimeoutId) { clearTimeout(finishTimeoutId); finishTimeoutId = null; }
      }

      function setPreset(min) {
        setTime(min * 60 * 1000);
        $presets.forEach(btn => btn.classList.toggle('active', Number(btn.dataset.preset) === min));
        $btnCustom.classList.remove('active');
      }

      function setTime(ms) {
        stopLoops();
        totalMs = ms;
        remainingMs = totalMs;
        state = STATES.IDLE;
        document.body.classList.remove('flash', 'finished');
        render();
      }

      function applyCustom() {
        const min = Math.max(0, Math.min(180, Number($inpMin.value) || 0));
        const sec = Math.max(0, Math.min(59, Number($inpSec.value) || 0));
        const ms = (min * 60 + sec) * 1000;
        if (ms <= 0) return;
        setTime(ms);
        $presets.forEach(btn => btn.classList.remove('active'));
        $btnCustom.classList.add('active');
        $customPanel.classList.remove('open');
      }

      function startOrPause() {
        if (state === STATES.FINISHED) {
          remainingMs = totalMs;
          state = STATES.IDLE;
          document.body.classList.remove('flash', 'finished');
        }
        if (state === STATES.RUNNING) {
          remainingMs = Math.max(0, targetEpoch - Date.now());
          state = STATES.PAUSED;
          stopLoops();
          render();
          return;
        }
        if (remainingMs <= 0) return;
        unlockAudio();
        targetEpoch = Date.now() + remainingMs;
        state = STATES.RUNNING;
        render();
        rafId = requestAnimationFrame(tick);
        intervalId = setInterval(() => { if (state === STATES.RUNNING) render(); }, 250);
        finishTimeoutId = setTimeout(triggerFinish, remainingMs + 20);
      }

      function reset() {
        stopLoops();
        remainingMs = totalMs;
        state = STATES.IDLE;
        document.body.classList.remove('flash', 'finished');
        render();
      }

      function unlockAudio() {
        if (audioCtx) return;
        try {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        } catch (_) {}
      }

      // 8비트 칩튠 느낌의 사각파(square) 비프
      function beep(delaySec, freq) {
        if (!audioCtx) return;
        const t0 = audioCtx.currentTime + delaySec;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(freq || 880, t0);
        gain.gain.setValueAtTime(0, t0);
        gain.gain.linearRampToValueAtTime(0.25, t0 + 0.005);
        gain.gain.linearRampToValueAtTime(0, t0 + 0.18);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(t0);
        osc.stop(t0 + 0.2);
      }

      function finishEffects() {
        unlockAudio();
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        // 8비트 펜파레: 도-미-솔
        beep(0.00, 523);
        beep(0.18, 659);
        beep(0.36, 784);
        beep(0.60, 1046);

        document.body.classList.remove('flash');
        void document.body.offsetWidth;
        document.body.classList.add('flash');
        setTimeout(() => document.body.classList.remove('flash'), 2600);

        if (window.confetti) {
          const palette = ['#FF9500', '#4A90E2', '#FF3B30', '#FFD700', '#00C853', '#2B2B2B'];
          const shoot = (x) => window.confetti({
            particleCount: 60,
            spread: 60,
            startVelocity: 50,
            origin: { x, y: 0.7 },
            colors: palette,
            shapes: ['square'],
            scalar: 1.4,
            ticks: 200,
          });
          shoot(0.2);
          setTimeout(() => shoot(0.5), 180);
          setTimeout(() => shoot(0.8), 360);
        }
      }

      function toggleFullscreen() {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen?.();
        } else {
          document.exitFullscreen?.();
        }
      }

      $presets.forEach(btn => btn.addEventListener('click', () => {
        const min = Number(btn.dataset.preset);
        setPreset(min);
      }));
      $btnStart.addEventListener('click', startOrPause);
      $btnReset.addEventListener('click', reset);
      $btnFullscreen.addEventListener('click', toggleFullscreen);

      $btnCustom.addEventListener('click', () => {
        const opening = !$customPanel.classList.contains('open');
        $customPanel.classList.toggle('open', opening);
        if (opening) setTimeout(() => { $inpMin.focus(); $inpMin.select(); }, 50);
      });
      $btnApplyCustom.addEventListener('click', applyCustom);
      $btnCloseCustom.addEventListener('click', () => $customPanel.classList.remove('open'));
      [$inpMin, $inpSec].forEach(inp => inp.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); applyCustom(); }
        else if (e.key === 'Escape') { e.preventDefault(); $customPanel.classList.remove('open'); }
      }));

      try {
        const savedTitle = localStorage.getItem('ddak-timer-title');
        if (savedTitle) $titleInput.value = savedTitle;
      } catch (_) {}
      $titleInput.addEventListener('input', () => {
        try { localStorage.setItem('ddak-timer-title', $titleInput.value); } catch (_) {}
      });
      $titleInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); $titleInput.blur(); }
      });

      document.addEventListener('keydown', (e) => {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
        if (e.code === 'Space') { e.preventDefault(); startOrPause(); }
        else if (e.key === 'r' || e.key === 'R') { e.preventDefault(); reset(); }
        else if (e.key === 'f' || e.key === 'F') { e.preventDefault(); toggleFullscreen(); }
      });

      setPreset(5);
    })();
  </script>
</body>
</html>
