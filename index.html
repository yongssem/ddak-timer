<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>우리반 타이머 · 무궁무진클래스</title>
  <meta name="description" content="초등 교실 전자칠판용 풀스크린 타이머." />
  <meta property="og:title" content="우리반 타이머" />
  <meta property="og:description" content="전자칠판용 풀스크린 타이머" />
  <meta property="og:type" content="website" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23f97316'/%3E%3Cpath d='M8 4v4l2.5 2' stroke='white' stroke-width='1.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            dark: '#0f172a',
            accent: '#f97316',
            'accent-hover': '#ea580c',
          },
        }
      }
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    html, body { height: 100%; }
    body {
      background-color: #0f172a;
      background-image: url('data:image/svg+xml,%3Csvg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"%3E%3Cpath d="M0 0h40v40H0V0zm20 20h20v20H20V20zM0 20h20v20H0V20zM20 0h20v20H20V0zM0 0h20v20H0V0z" fill="%231e293b" fill-opacity="0.2" fill-rule="evenodd"/%3E%3C/svg%3E');
      overflow: hidden;
      transition: background-color 0.15s ease;
    }

    .glass-panel {
      background: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* === 브루탈리즘 === */
    .brutal {
      border: 3px solid #0f172a;
      box-shadow: 6px 6px 0 #0f172a, 6px 6px 0 2px #f97316;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
      border-radius: 14px;
    }
    .brutal:hover {
      transform: translate(-3px, -3px);
      box-shadow: 10px 10px 0 #0f172a, 10px 10px 0 2px #f97316;
    }
    .brutal:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 #0f172a, 2px 2px 0 2px #f97316;
    }

    .brutal-soft {
      border: 2px solid #1e293b;
      box-shadow: 4px 4px 0 #1e293b;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
      border-radius: 12px;
    }
    .brutal-soft:hover {
      transform: translate(-2px, -2px);
      box-shadow: 7px 7px 0 #1e293b;
    }
    .brutal-soft:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 #1e293b;
    }

    /* 작은 아이콘 버튼 호버 */
    .hover-pop {
      transition: transform 0.12s ease, background-color 0.12s ease;
    }
    .hover-pop:hover { transform: translateY(-2px) scale(1.05); }
    .hover-pop:active { transform: translateY(1px) scale(0.97); }

    /* 프리셋 호버 */
    .preset {
      transition: transform 0.12s ease, background-color 0.12s ease, color 0.12s ease, box-shadow 0.12s ease;
    }
    .preset:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 0 #0f172a;
    }
    .preset:active {
      transform: translateY(1px);
      box-shadow: 0 1px 0 #0f172a;
    }

    /* 타이머 숫자 호버 인터랙션 */
    .timer-wrap {
      transition: transform 0.2s ease;
      cursor: pointer;
    }
    .timer-wrap:hover { transform: scale(1.02); }
    .timer-wrap:hover .timer-glow { text-shadow: 0 0 50px rgba(249, 115, 22, 0.55); }

    .timer-glow {
      text-shadow: 0 0 30px rgba(249, 115, 22, 0.35);
      transition: color 0.2s ease, text-shadow 0.2s ease;
    }

    .timer-digits-num { color: #f1f5f9; transition: color 0.2s ease; }
    .timer-colon {
      color: #f97316;
      margin: 0 0.04em;
    }
    .timer-colon.blink { animation: colonBlink 1s steps(2, start) infinite; }
    @keyframes colonBlink { 50% { opacity: 0.15; } }

    /* 종료 상태 */
    .finished .timer-digits-num { color: #ef4444; }
    .finished .timer-glow { text-shadow: 0 0 40px rgba(239, 68, 68, 0.7); }

    /* 마지막 10초 긴급 */
    .urgent .timer-digits-num { color: #ef4444; }
    .urgent .timer-glow {
      text-shadow: 0 0 35px rgba(239, 68, 68, 0.6);
      animation: urgentPulse 1s steps(2, end) infinite;
    }
    @keyframes urgentPulse {
      0%, 49%   { transform: scale(1); }
      50%, 100% { transform: scale(1.03); }
    }
    .urgent #progressFill {
      background: linear-gradient(90deg, #ef4444, #f97316);
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.7);
    }

    /* 종료 깜빡임 */
    .flash { animation: flashBg 0.4s steps(2, end) 5; }
    @keyframes flashBg {
      0%, 49%   { background-color: #ef4444; }
      50%, 100% { background-color: #0f172a; }
    }

    /* 프리셋 active */
    .preset.active {
      background: #f97316;
      color: white;
      box-shadow: 0 4px 14px rgba(249, 115, 22, 0.35);
    }

    /* 진행바 */
    #progressFill {
      background: #f97316;
      box-shadow: 0 0 12px rgba(249, 115, 22, 0.6);
      transition: width 0.25s linear, background 0.2s ease;
    }

    /* 제목 입력 */
    .title-input {
      background: transparent;
      border: none;
      outline: none;
      color: #cbd5e1;
      text-align: center;
      font-weight: 500;
      width: 22rem;
      max-width: 90vw;
      padding: 0.2rem 0.4rem;
      border-bottom: 1px dashed transparent;
    }
    .title-input::placeholder { color: #475569; }
    .title-input:focus { border-bottom-color: #475569; color: #f1f5f9; }

    /* 커스텀 시간 패널 */
    .custom-panel {
      display: none;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .custom-panel.open { display: flex; }
    .custom-panel input {
      width: 5rem;
      font-size: 1.1rem;
      text-align: center;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255,255,255,0.1);
      color: #f1f5f9;
      border-radius: 0.75rem;
      padding: 0.4rem 0.6rem;
      outline: none;
    }
    .custom-panel input:focus { border-color: #f97316; }
    .custom-panel label { color: #94a3b8; font-size: 0.85rem; font-weight: 500; }

    ::-webkit-scrollbar { display: none; }

    @media (max-width: 640px) {
      .title-input { font-size: 1rem; width: 16rem; }
    }
  </style>
</head>
<body class="text-gray-100 min-h-screen flex flex-col font-sans antialiased">

  <!-- 상단 -->
  <header class="p-4 sm:p-6 flex justify-between items-start w-full relative z-10 gap-3 flex-wrap">
    <nav class="brutal-soft bg-slate-900/80 p-1.5 flex gap-1 flex-wrap">
      <button class="preset px-3 sm:px-4 py-2 rounded-lg text-sm font-bold text-gray-300 hover:text-white hover:bg-slate-700/60" data-preset="1">1분</button>
      <button class="preset px-3 sm:px-4 py-2 rounded-lg text-sm font-bold text-gray-300 hover:text-white hover:bg-slate-700/60" data-preset="3">3분</button>
      <button class="preset px-3 sm:px-4 py-2 rounded-lg text-sm font-bold text-gray-300 hover:text-white hover:bg-slate-700/60" data-preset="5">5분</button>
      <button class="preset px-3 sm:px-4 py-2 rounded-lg text-sm font-bold text-gray-300 hover:text-white hover:bg-slate-700/60" data-preset="10">10분</button>
      <button class="preset px-3 sm:px-4 py-2 rounded-lg text-sm font-bold text-gray-300 hover:text-white hover:bg-slate-700/60" data-preset="15">15분</button>
      <button id="btnCustom" class="px-3 sm:px-4 py-2 rounded-lg text-sm font-bold text-accent hover:text-white hover:bg-accent border-2 border-accent/60 transition-colors">+TIME</button>
    </nav>

    <div class="brutal-soft bg-slate-900/80 p-1.5 flex gap-1">
      <button id="btnSound" aria-label="사운드" class="hover-pop p-2.5 rounded-lg text-gray-300 hover:text-white hover:bg-slate-700/60">
        <svg id="iconSoundOn" class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M10 19l-7-7H2V8h5l7-7v18z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
        </svg>
        <svg id="iconSoundOff" class="h-5 w-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M10 19l-7-7H2V8h5l7-7v18zM17 9l4 4m0-4l-4 4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
        </svg>
      </button>
      <button id="btnFullscreen" aria-label="풀스크린" class="hover-pop p-2.5 rounded-lg text-gray-300 hover:text-white hover:bg-slate-700/60">
        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- 커스텀 시간 패널 -->
  <div id="customPanel" class="custom-panel brutal-soft bg-slate-900/90 px-4 py-3 mx-auto">
    <label for="inpMin">MIN</label>
    <input id="inpMin" type="number" min="0" max="180" inputmode="numeric" value="0" />
    <label for="inpSec">SEC</label>
    <input id="inpSec" type="number" min="0" max="59" inputmode="numeric" value="30" />
    <button id="btnApplyCustom" class="brutal bg-accent hover:bg-accent-hover text-white text-sm font-bold px-4 py-2">SET</button>
    <button id="btnCloseCustom" class="brutal-soft bg-slate-800 text-slate-200 hover:text-white text-sm font-bold px-3 py-2">✕</button>
  </div>

  <!-- 메인 -->
  <main class="flex-1 flex flex-col items-center justify-center relative w-full max-w-5xl mx-auto px-4 sm:px-6">
    <div class="mb-8 sm:mb-12">
      <input id="titleInput" class="title-input text-lg sm:text-xl" type="text" maxlength="40" placeholder="제목을 입력하세요" />
    </div>

    <div class="timer-wrap text-[7rem] sm:text-[12rem] md:text-[16rem] lg:text-[20rem] leading-none font-mono font-bold tracking-tight flex items-center justify-center timer-glow relative z-10 select-none">
      <span id="mm" class="timer-digits-num">05</span>
      <span id="colon" class="timer-colon pb-6 sm:pb-12 md:pb-20">:</span>
      <span id="ss" class="timer-digits-num">00</span>
    </div>

    <div class="w-full max-w-3xl mt-6 sm:mt-8 h-2 bg-slate-800/80 rounded-full overflow-hidden shadow-inner">
      <div id="progressFill" class="h-full rounded-full" style="width:100%"></div>
    </div>
  </main>

  <!-- 하단 컨트롤 -->
  <footer class="p-4 sm:p-8 flex flex-col items-center gap-4 sm:gap-6 relative z-10">
    <div class="flex items-center gap-4 sm:gap-6 flex-wrap justify-center">
      <button id="btnStart" class="brutal bg-accent hover:bg-accent-hover text-white font-black py-3 sm:py-4 px-8 sm:px-14 text-base sm:text-xl tracking-widest">START</button>
      <button id="btnPlus" class="brutal-soft bg-slate-800 text-slate-100 hover:text-white font-bold py-3 sm:py-4 px-4 sm:px-6 text-sm hover:bg-slate-700">+1분</button>
      <button id="btnReset" class="brutal-soft bg-slate-800 text-slate-100 hover:text-white font-black py-3 sm:py-4 px-6 sm:px-10 text-base sm:text-lg hover:bg-slate-700 tracking-wider">RESET</button>
    </div>

    <div class="text-[10px] sm:text-xs text-slate-500 font-medium flex gap-2 sm:gap-4 opacity-70 flex-wrap justify-center">
      <span>[SPACE] START/STOP</span>
      <span>[R] RESET</span>
      <span>[F] FULL</span>
      <span>[+] +1분</span>
      <span>[M] MUTE</span>
    </div>

    <div class="text-[10px] sm:text-xs text-slate-600">
      © 2026 무궁무진클래스 · 용쌤 ·
      <a href="https://mumuclass.kr" target="_blank" rel="noopener" class="text-accent/70 hover:text-accent underline">mumuclass.kr</a>
    </div>
  </footer>

  <script>
    (() => {
      const STATES = { IDLE: 'idle', RUNNING: 'running', PAUSED: 'paused', FINISHED: 'finished' };

      const $mm = document.getElementById('mm');
      const $ss = document.getElementById('ss');
      const $colon = document.getElementById('colon');
      const $btnStart = document.getElementById('btnStart');
      const $btnReset = document.getElementById('btnReset');
      const $btnPlus = document.getElementById('btnPlus');
      const $btnSound = document.getElementById('btnSound');
      const $iconSoundOn = document.getElementById('iconSoundOn');
      const $iconSoundOff = document.getElementById('iconSoundOff');
      const $btnFullscreen = document.getElementById('btnFullscreen');
      const $progressFill = document.getElementById('progressFill');
      const $presets = document.querySelectorAll('.preset[data-preset]');
      const $btnCustom = document.getElementById('btnCustom');
      const $customPanel = document.getElementById('customPanel');
      const $inpMin = document.getElementById('inpMin');
      const $inpSec = document.getElementById('inpSec');
      const $btnApplyCustom = document.getElementById('btnApplyCustom');
      const $btnCloseCustom = document.getElementById('btnCloseCustom');
      const $titleInput = document.getElementById('titleInput');

      let state = STATES.IDLE;
      let totalMs = 0;
      let remainingMs = 0;
      let targetEpoch = 0;
      let rafId = null;
      let intervalId = null;
      let finishTimeoutId = null;
      let audioCtx = null;
      let soundOn = true;
      let lastTickSec = -1;
      let wakeLock = null;
      try { soundOn = localStorage.getItem('ddak-timer-sound') !== 'off'; } catch (_) {}

      function render() {
        const ms = Math.max(0, state === STATES.RUNNING ? targetEpoch - Date.now() : remainingMs);
        const totalSec = Math.ceil(ms / 1000);
        const mm = String(Math.floor(totalSec / 60)).padStart(2, '0');
        const ss = String(totalSec % 60).padStart(2, '0');
        if ($mm.textContent !== mm) $mm.textContent = mm;
        if ($ss.textContent !== ss) $ss.textContent = ss;

        $btnStart.textContent = state === STATES.RUNNING ? 'STOP' : (state === STATES.PAUSED ? 'GO!' : 'START');

        document.body.classList.toggle('finished', state === STATES.FINISHED);
        $colon.classList.toggle('blink', state === STATES.RUNNING);

        const pct = totalMs > 0 ? Math.max(0, Math.min(100, (ms / totalMs) * 100)) : 0;
        $progressFill.style.width = pct + '%';

        const urgent = state === STATES.RUNNING && totalSec > 0 && totalSec <= 10;
        document.body.classList.toggle('urgent', urgent);
        if (urgent && totalSec !== lastTickSec) {
          lastTickSec = totalSec;
          tickBeep();
        }
        if (!urgent) lastTickSec = -1;
      }

      function tick() {
        if (state !== STATES.RUNNING) return;
        if (Date.now() >= targetEpoch) { triggerFinish(); return; }
        render();
        rafId = requestAnimationFrame(tick);
      }

      function triggerFinish() {
        if (state === STATES.FINISHED) return;
        stopLoops();
        releaseWakeLock();
        remainingMs = 0;
        state = STATES.FINISHED;
        document.body.classList.remove('urgent');
        lastTickSec = -1;
        render();
        finishEffects();
      }

      function stopLoops() {
        if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
        if (intervalId) { clearInterval(intervalId); intervalId = null; }
        if (finishTimeoutId) { clearTimeout(finishTimeoutId); finishTimeoutId = null; }
      }

      function setPreset(min) {
        setTime(min * 60 * 1000);
        $presets.forEach(btn => btn.classList.toggle('active', Number(btn.dataset.preset) === min));
      }

      function setTime(ms) {
        stopLoops();
        totalMs = ms;
        remainingMs = totalMs;
        state = STATES.IDLE;
        document.body.classList.remove('flash', 'finished', 'urgent');
        lastTickSec = -1;
        releaseWakeLock();
        render();
      }

      function addOneMinute() {
        const ADD = 60 * 1000;
        if (state === STATES.RUNNING) {
          targetEpoch += ADD;
          totalMs += ADD;
          if (finishTimeoutId) clearTimeout(finishTimeoutId);
          finishTimeoutId = setTimeout(triggerFinish, Math.max(0, targetEpoch - Date.now()) + 20);
        } else if (state === STATES.PAUSED) {
          remainingMs += ADD;
          totalMs += ADD;
        } else {
          if (state === STATES.FINISHED) {
            document.body.classList.remove('flash', 'finished', 'urgent');
            totalMs = 0;
          }
          totalMs += ADD;
          remainingMs = totalMs;
          state = STATES.IDLE;
        }
        render();
      }

      function applyCustom() {
        const min = Math.max(0, Math.min(180, Number($inpMin.value) || 0));
        const sec = Math.max(0, Math.min(59, Number($inpSec.value) || 0));
        const ms = (min * 60 + sec) * 1000;
        if (ms <= 0) return;
        setTime(ms);
        $presets.forEach(btn => btn.classList.remove('active'));
        $customPanel.classList.remove('open');
      }

      function startOrPause() {
        if (state === STATES.FINISHED) {
          remainingMs = totalMs;
          state = STATES.IDLE;
          document.body.classList.remove('flash', 'finished', 'urgent');
        }
        if (state === STATES.RUNNING) {
          remainingMs = Math.max(0, targetEpoch - Date.now());
          state = STATES.PAUSED;
          stopLoops();
          releaseWakeLock();
          render();
          return;
        }
        if (remainingMs <= 0) return;
        unlockAudio();
        requestWakeLock();
        targetEpoch = Date.now() + remainingMs;
        state = STATES.RUNNING;
        render();
        rafId = requestAnimationFrame(tick);
        intervalId = setInterval(() => { if (state === STATES.RUNNING) render(); }, 250);
        finishTimeoutId = setTimeout(triggerFinish, remainingMs + 20);
      }

      function reset() {
        stopLoops();
        remainingMs = totalMs;
        state = STATES.IDLE;
        lastTickSec = -1;
        document.body.classList.remove('flash', 'finished', 'urgent');
        releaseWakeLock();
        render();
      }

      async function requestWakeLock() {
        try {
          if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
        } catch (_) {}
      }
      function releaseWakeLock() {
        if (wakeLock) { try { wakeLock.release(); } catch (_) {} wakeLock = null; }
      }
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && state === STATES.RUNNING && !wakeLock) requestWakeLock();
      });

      function unlockAudio() {
        if (audioCtx) return;
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {}
      }

      function tickBeep() {
        if (!soundOn || !audioCtx) return;
        const t0 = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(1200, t0);
        gain.gain.setValueAtTime(0, t0);
        gain.gain.linearRampToValueAtTime(0.18, t0 + 0.005);
        gain.gain.linearRampToValueAtTime(0, t0 + 0.06);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(t0); osc.stop(t0 + 0.08);
      }

      function beep(delaySec, freq) {
        if (!soundOn || !audioCtx) return;
        const t0 = audioCtx.currentTime + delaySec;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(freq || 880, t0);
        gain.gain.setValueAtTime(0, t0);
        gain.gain.linearRampToValueAtTime(0.25, t0 + 0.005);
        gain.gain.linearRampToValueAtTime(0, t0 + 0.18);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(t0); osc.stop(t0 + 0.2);
      }

      function finishEffects() {
        unlockAudio();
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        beep(0.00, 523);
        beep(0.18, 659);
        beep(0.36, 784);
        beep(0.60, 1046);

        document.body.classList.remove('flash');
        void document.body.offsetWidth;
        document.body.classList.add('flash');
        setTimeout(() => document.body.classList.remove('flash'), 2200);

        if (window.confetti) {
          const palette = ['#f97316', '#fb923c', '#ef4444', '#fbbf24', '#f1f5f9'];
          const shoot = (x) => window.confetti({
            particleCount: 70,
            spread: 70,
            startVelocity: 55,
            origin: { x, y: 0.7 },
            colors: palette,
            scalar: 1.2,
            ticks: 220,
          });
          shoot(0.2);
          setTimeout(() => shoot(0.5), 180);
          setTimeout(() => shoot(0.8), 360);
        }
      }

      function toggleFullscreen() {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
        else document.exitFullscreen?.();
      }

      function updateSoundBtn() {
        $iconSoundOn.classList.toggle('hidden', !soundOn);
        $iconSoundOff.classList.toggle('hidden', soundOn);
      }
      function toggleSound() {
        soundOn = !soundOn;
        try { localStorage.setItem('ddak-timer-sound', soundOn ? 'on' : 'off'); } catch (_) {}
        updateSoundBtn();
      }
      updateSoundBtn();

      $presets.forEach(btn => btn.addEventListener('click', () => setPreset(Number(btn.dataset.preset))));
      $btnStart.addEventListener('click', startOrPause);
      $btnReset.addEventListener('click', reset);
      $btnPlus.addEventListener('click', addOneMinute);
      $btnSound.addEventListener('click', toggleSound);
      $btnFullscreen.addEventListener('click', toggleFullscreen);

      $btnCustom.addEventListener('click', () => {
        const opening = !$customPanel.classList.contains('open');
        $customPanel.classList.toggle('open', opening);
        if (opening) setTimeout(() => { $inpMin.focus(); $inpMin.select(); }, 50);
      });
      $btnApplyCustom.addEventListener('click', applyCustom);
      $btnCloseCustom.addEventListener('click', () => $customPanel.classList.remove('open'));
      [$inpMin, $inpSec].forEach(inp => inp.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); applyCustom(); }
        else if (e.key === 'Escape') { e.preventDefault(); $customPanel.classList.remove('open'); }
      }));

      try {
        const savedTitle = localStorage.getItem('ddak-timer-title');
        if (savedTitle) $titleInput.value = savedTitle;
      } catch (_) {}
      $titleInput.addEventListener('input', () => {
        try { localStorage.setItem('ddak-timer-title', $titleInput.value); } catch (_) {}
      });
      $titleInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); $titleInput.blur(); }
      });

      document.addEventListener('keydown', (e) => {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
        if (e.code === 'Space') { e.preventDefault(); startOrPause(); }
        else if (e.key === 'r' || e.key === 'R') { e.preventDefault(); reset(); }
        else if (e.key === 'f' || e.key === 'F') { e.preventDefault(); toggleFullscreen(); }
        else if (e.key === '+' || e.key === '=') { e.preventDefault(); addOneMinute(); }
        else if (e.key === 'm' || e.key === 'M') { e.preventDefault(); toggleSound(); }
      });

      setPreset(5);
    })();
  </script>
</body>
</html>
